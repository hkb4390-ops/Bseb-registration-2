<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault - HRRY.ONLINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        :root { --bg: #07090e; --card: rgba(18, 24, 38, 0.8); --primary: #6366f1; --accent: #06b6d4; --text: #f9fafb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: rgba(7, 9, 14, 0.9); padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; }
        .brand { font-size: 20px; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 900px; width: 100%; margin: 20px auto; padding: 0 16px; flex: 1; }
        #welcomeSection { text-align: center; padding: 60px 20px; }
        .video-card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; overflow: hidden; }
        .video-wrapper { aspect-ratio: 16/9; background: #000; position: relative; }
        .video-details { padding: 20px; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { padding: 12px 20px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon"><i class="fas fa-play"></i></div>
            <span>hrry.online</span>
        </a>
    </header>

    <div class="container">
        <section id="welcomeSection" style="display:none;">
            <h1>Welcome to HRRY.ONLINE</h1>
            <p style="color:#9ca3af; margin-top:10px;">Telegram bot generated stream links will play here automatically.</p>
        </section>

        <section id="playerSection" style="display:none;">
            <div class="video-card">
                <div class="video-wrapper">
                    <video id="player" controls playsinline crossorigin="anonymous">
                        <source id="videoSource" src="" type="video/mp4">
                    </video>
                </div>
                <div class="video-details">
                    <h2 id="displayTitle" style="font-size:18px;">Telegram Video</h2>
                    <div class="action-buttons">
                        <a id="dlBtn" href="#" class="btn btn-primary" download target="_blank"><i class="fas fa-download"></i> Download Video</a>
                        <button class="btn btn-secondary" onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied!');"><i class="fas fa-link"></i> Copy Link</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const videoUrl = urlParams.get('url');
            const videoTitle = urlParams.get('title') || 'Telegram Stream Video';

            if (videoUrl) {
                document.getElementById('playerSection').style.display = 'block';
                document.getElementById('displayTitle').innerText = decodeURIComponent(videoTitle);
                document.getElementById('dlBtn').href = videoUrl;

                const videoEl = document.getElementById('player');
                document.getElementById('videoSource').src = videoUrl;
                videoEl.load();

                new Plyr('#player', { autoplay: true });
            } else {
                document.getElementById('welcomeSection').style.display = 'block';
            }
        });
    </script>
</body>
</html>
